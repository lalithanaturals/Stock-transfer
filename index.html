<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lalitha Naturals - Master Operations Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR / Barcode Reader Library (ZXing) -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-36">

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-40 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-sm font-bold tracking-wide">LALITHA NATURALS</h1>
            <p class="text-[10px] text-emerald-100">Master Stock & Transit Hub</p>
        </div>
        <div id="liveTime" class="text-[11px] font-medium text-emerald-100"></div>
    </header>

    <!-- Main Mobile Container -->
    <main class="max-w-md mx-auto px-3 py-3 space-y-3">
        
        <!-- Mode Switcher Tabs -->
        <div class="bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-2 gap-1">
            <button onclick="switchMode('audit')" id="tabAuditBtn" class="py-2.5 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow-sm flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-clipboard-check"></i> 1. Smart Audit
            </button>
            <button onclick="switchMode('packing')" id="tabPackingBtn" class="py-2.5 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-truck-fast"></i> 2. Transit & Sheets
            </button>
        </div>

        <!-- AUDIT & INTELLIGENT STOCK CHECK VIEW -->
        <div id="auditViewSection" class="space-y-3">
            <!-- Branch & Risk Dashboard Card -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">Source Branch</label>
                        <select id="sourceBranch" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-xs font-semibold outline-none">
                            <option value="Gajuwaka">Gajuwaka</option>
                            <option value="Kurmannapalem">Kurmannapalem</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-bold uppercase text-slate-400 mb-1">Destination</label>
                        <select id="destBranch" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-xs font-semibold outline-none">
                            <option value="Kurmannapalem Packing">Kurmannapalem Pkg</option>
                            <option value="Gajuwaka Packing">Gajuwaka Pkg</option>
                        </select>
                    </div>
                </div>
                <!-- Risk & Velocity Metrics Banner -->
                <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl flex justify-between items-center text-xs">
                    <div>
                        <span class="text-[10px] text-emerald-800 font-bold block">Estimated Stockout Risk</span>
                        <span id="riskTotalValue" class="text-sm font-extrabold text-emerald-900">₹0</span>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-emerald-800 font-bold block">Velocity Status</span>
                        <span id="velocityStatusLabel" class="text-[10px] font-bold px-2 py-0.5 bg-emerald-200 text-emerald-900 rounded-full">Optimized</span>
                    </div>
                </div>
            </div>

            <!-- Search, Scan & Quick Tools -->
            <div class="space-y-2">
                <div class="flex gap-1.5">
                    <div class="relative flex-1">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 text-xs">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchBox" placeholder="Search item or code..." 
                            class="w-full pl-9 pr-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none shadow-sm">
                    </div>
                    <button onclick="openScannerModal()" class="bg-indigo-600 text-white font-semibold px-3 py-2.5 rounded-xl text-xs shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-barcode"></i> Scan
                    </button>
                    <button onclick="fillRandomValues()" class="bg-amber-600 text-white font-semibold px-2.5 py-2.5 rounded-xl text-xs shadow-sm flex items-center">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </button>
                </div>
                <!-- Category Horizontal Scroller -->
                <div id="categoryTabs" class="flex overflow-x-auto gap-1.5 pb-1 scrollbar-none"></div>
            </div>

            <!-- Mobile Items List -->
            <div id="itemsContainer" class="space-y-2"></div>
        </div>

        <!-- TRANSIT & PACKING SHEETS VIEW -->
        <div id="packingViewSection" class="hidden space-y-3">
            <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center gap-2">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400">Ledger Date</label>
                    <input type="date" id="lookupDateInput" onchange="loadTransitSheets()" class="bg-slate-50 border border-slate-300 rounded-lg p-1.5 text-xs font-semibold mt-1 outline-none">
                </div>
                <div id="mobileSheetCount" class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
                    0 records
                </div>
            </div>

            <!-- Transit Feed Container -->
            <div id="transitSheetsFeed" class="space-y-3"></div>
        </div>

    </main>

    <!-- Sticky Mobile Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-3 shadow-2xl z-40 space-y-2">
        <div class="max-w-md mx-auto flex justify-between items-center text-xs">
            <span class="text-slate-500 font-medium">Total Shortages:</span>
            <span id="totalRequestedCount" class="font-bold text-emerald-700 text-sm">0 Items</span>
        </div>
        <div class="max-w-md mx-auto grid grid-cols-4 gap-1">
            <button onclick="openThermalPreview()" class="bg-amber-700 text-white font-semibold py-2.5 rounded-xl text-[11px] shadow transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-receipt"></i> 80mm
            </button>
            <button onclick="openPrintPreview()" class="bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-[11px] shadow transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-print"></i> A4
            </button>
            <button onclick="shareToWhatsApp()" class="bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-[11px] shadow transition flex items-center justify-center gap-1">
                <i class="fa-brands fa-whatsapp"></i> WA
            </button>
            <button onclick="dispatchTransitSheet()" class="bg-indigo-600 text-white font-semibold py-2.5 rounded-xl text-[11px] shadow transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-paper-plane"></i> Dispatch
            </button>
        </div>
    </div>

    <!-- Barcode Scanner Modal -->
    <div id="scannerModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden p-4 space-y-3 text-center">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-xs text-slate-800"><i class="fa-solid fa-barcode mr-1"></i> Scan Item Barcode</h3>
                <button onclick="closeScannerModal()" class="text-slate-500 text-lg font-bold">&times;</button>
            </div>
            <div class="relative bg-black rounded-xl overflow-hidden h-64 flex items-center justify-center">
                <video id="interactive" class="w-full h-full object-cover"></video>
                <div class="absolute inset-0 border-2 border-emerald-500/50 pointer-events-none flex items-center justify-center">
                    <span class="text-white text-[10px] bg-black/60 px-2 py-1 rounded">Align barcode inside frame</span>
                </div>
            </div>
            <p id="scanStatus" class="text-xs text-slate-500">Point camera at item barcode or QR...</p>
            <button onclick="closeScannerModal()" class="w-full py-2 bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs">Close Scanner</button>
        </div>
    </div>

    <!-- Thermal Print Modal -->
    <div id="thermalModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-xs rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-amber-800 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-xs flex items-center gap-1.5"><i class="fa-solid fa-receipt"></i> 80mm Receipt</h3>
                <button onclick="closeThermalPreview()" class="text-white text-lg font-bold px-2">&times;</button>
            </div>
            <div class="p-3 overflow-y-auto bg-slate-100 flex-1 flex justify-center">
                <div id="thermalPaper" class="bg-white shadow p-3 w-[270px] text-slate-900 font-mono text-[10px] leading-tight rounded border border-slate-300"></div>
            </div>
            <div class="bg-white border-t border-slate-200 p-3 flex gap-2">
                <button onclick="closeThermalPreview()" class="flex-1 py-2 bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs">Cancel</button>
                <button onclick="triggerThermalPrint()" class="flex-1 py-2 bg-amber-800 text-white font-semibold rounded-xl text-xs shadow"><i class="fa-solid fa-print"></i> Print</button>
            </div>
        </div>
    </div>

    <!-- A4 Print Preview Modal -->
    <div id="previewModal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-slate-800 text-white px-4 py-3 flex justify-between items-center">
                <h3 class="font-bold text-xs flex items-center gap-1.5"><i class="fa-solid fa-file-lines text-emerald-400"></i> Optimized A4 Preview</h3>
                <button onclick="closePrintPreview()" class="text-white text-lg font-bold px-2">&times;</button>
            </div>
            <div class="p-3 overflow-y-auto bg-slate-100 flex-1 flex justify-center">
                <div id="previewPaper" class="bg-white shadow p-3 w-full text-slate-800 text-[11px] rounded border border-slate-300"></div>
            </div>
            <div class="bg-white border-t border-slate-200 p-3 flex gap-2">
                <button onclick="closePrintPreview()" class="flex-1 py-2 bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs">Cancel</button>
                <button onclick="triggerDirectPrint()" class="flex-1 py-2 bg-emerald-600 text-white font-semibold rounded-xl text-xs shadow"><i class="fa-solid fa-print"></i> Print</button>
            </div>
        </div>
    </div>

    <!-- Hidden Templates -->
    <div id="pdfTemplateContainer" style="display: none;"></div>
    <div id="thermalTemplateContainer" style="position: absolute; left: -9999px; top: 0; width: 280px;"></div>

    <!-- Application Script -->
    <script>
        const defaultInventoryData = {
            "Groceries": [
                { id: 1, name: "White Peas", uom: "250g", code: "1503", min: 10, price: 35, velocityDays: 2 },
                { id: 2, name: "Urad Dal", uom: "500g", code: "1249", min: 10, price: 75, velocityDays: 3 },
                { id: 3, name: "Sugar", uom: "1kg", code: "1252", min: 10, price: 48, velocityDays: 1 },
                { id: 4, name: "Toor Dal", uom: "1kg", code: "1243", min: 8, price: 140, velocityDays: 4 },
                { id: 5, name: "Crystal Salt", uom: "1kg", code: "1516", min: 10, price: 25, velocityDays: 7 }
            ],
            "Flours": [
                { id: 6, name: "7 Grain Atta", uom: "1kg", code: "1028", min: 15, price: 90, velocityDays: 2 },
                { id: 7, name: "Ragi Flour", uom: "1kg", code: "1026", min: 15, price: 65, velocityDays: 3 }
            ],
            "Spices": [
                { id: 8, name: "Jeera", uom: "250g", code: "1360", min: 10, price: 120, velocityDays: 5 },
                { id: 9, name: "Coriander", uom: "100g", code: "1667", min: 8, price: 40, velocityDays: 4 }
            ]
        };

        let inventoryData = JSON.parse(localStorage.getItem('lalitha_master_inventory')) || defaultInventoryData;
        let activeCategory = "Groceries";
        const shelfStock = {};
        const itemBatches = {}; // Batch & Expiry tracking
        let activeMobilePayload = null;
        let codeReader = null;

        function initMasterSampleData() {
            let dbStore = JSON.parse(localStorage.getItem('lalitha_transit_ledger')) || {};
            const todayStr = new Date().toISOString().split('T')[0];
            if (!dbStore[todayStr]) {
                dbStore[todayStr] = [
                    {
                        id: 'transit_1',
                        src: "Gajuwaka",
                        dst: "Kurmannapalem Packing",
                        time: Date.now() - 10000000,
                        status: "In Transit",
                        items: [
                            { cat: "Groceries", name: "White Peas", uom: "250g", code: "1503", min: 10, stock: 2, reqQty: 8, batch: "B202", expiry: "2026-10-15" }
                        ]
                    }
                ];
                localStorage.setItem('lalitha_transit_ledger', JSON.stringify(dbStore));
            }
        }

        function initApp() {
            initMasterSampleData();
            updateClock();
            setInterval(updateClock, 1000);
            renderTabs();
            renderItems();

            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('lookupDateInput').value = todayStr;

            document.getElementById('searchBox').addEventListener('input', (e) => {
                renderItems(e.target.value);
            });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('liveTime').innerText = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        }

        function switchMode(mode) {
            if(mode === 'audit') {
                document.getElementById('auditViewSection').classList.remove('hidden');
                document.getElementById('packingViewSection').classList.add('hidden');
                document.getElementById('tabAuditBtn').className = "py-2.5 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow-sm flex items-center justify-center gap-1.5";
                document.getElementById('tabPackingBtn').className = "py-2.5 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5";
                activeMobilePayload = null;
            } else {
                document.getElementById('auditViewSection').classList.add('hidden');
                document.getElementById('packingViewSection').classList.remove('hidden');
                document.getElementById('tabPackingBtn').className = "py-2.5 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow-sm flex items-center justify-center gap-1.5";
                document.getElementById('tabAuditBtn').className = "py-2.5 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-600 flex items-center justify-center gap-1.5";
                loadTransitSheets();
            }
        }

        function renderTabs() {
            const container = document.getElementById('categoryTabs');
            container.innerHTML = Object.keys(inventoryData).map(cat => `
                <button onclick="switchCategory('${cat}')" class="px-3 py-1.5 rounded-xl text-[11px] font-semibold whitespace-nowrap transition ${activeCategory === cat ? 'bg-emerald-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200'}">${cat}</button>
            `).join('');
        }

        function switchCategory(cat) {
            activeCategory = cat;
            renderTabs();
            renderItems(document.getElementById('searchBox').value);
        }

        function renderItems(filter = "") {
            const container = document.getElementById('itemsContainer');
            let itemsToDisplay = [];

            if (filter.trim() !== "") {
                const query = filter.toLowerCase();
                for (let cat in inventoryData) {
                    inventoryData[cat].forEach(item => {
                        if (item.name.toLowerCase().includes(query) || item.code.includes(query)) itemsToDisplay.push({ ...item, category: cat });
                    });
                }
            } else {
                itemsToDisplay = inventoryData[activeCategory] ? inventoryData[activeCategory].map(item => ({ ...item, category: activeCategory })) : [];
            }

            container.innerHTML = itemsToDisplay.map((item) => {
                const key = `${item.category}_${item.code}_${item.uom}`;
                const stock = shelfStock[key] !== undefined ? shelfStock[key] : "";
                const shortage = (shelfStock[key] !== undefined && shelfStock[key] < item.min) ? (item.min - shelfStock[key]) : 0;
                const batchInfo = itemBatches[key] || { batch: "B-Default", expiry: "" };

                // Expiry warning indicator (< 30 days)
                let expiryBadge = "";
                if(batchInfo.expiry) {
                    const daysLeft = Math.ceil((new Date(batchInfo.expiry) - new Date()) / (1000 * 60 * 60 * 24));
                    if(daysLeft <= 30 && daysLeft >= 0) {
                        expiryBadge = `<span class="text-[9px] font-bold text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-200">Exp: ${daysLeft}d</span>`;
                    }
                }

                return `
                    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="text-[10px] font-bold px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded">#${item.code}</span>
                                <span class="text-[10px] font-semibold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">Min: ${item.min}</span>
                                ${shortage > 0 ? `<span class="text-[10px] font-bold text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-200">Need: ${shortage}</span>` : ''}
                                ${expiryBadge}
                            </div>
                            <span class="text-[10px] text-slate-400">₹${item.price}</span>
                        </div>
                        <div class="flex justify-between items-center gap-2">
                            <div>
                                <h3 class="text-xs font-bold text-slate-800">${item.name}</h3>
                                <p class="text-[10px] text-slate-500">UOM: ${item.uom}</p>
                            </div>
                            <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 p-1 rounded-xl">
                                <button onclick="updateStock('${key}', -1)" class="w-8 h-8 flex items-center justify-center bg-white border border-slate-200 rounded-lg text-slate-700 font-bold">-</button>
                                <input type="number" id="stock_${key}" value="${stock}" placeholder="0" onchange="setStock('${key}', this.value)" class="w-10 text-center text-xs font-bold bg-transparent outline-none">
                                <button onclick="updateStock('${key}', 1)" class="w-8 h-8 flex items-center justify-center bg-emerald-600 text-white rounded-lg font-bold">+</button>
                            </div>
                        </div>
                        <!-- Batch & Expiry Inputs (Collapsible Compact Bar) -->
                        <div class="flex gap-1.5 pt-1 border-t border-slate-100 text-[10px]">
                            <input type="text" placeholder="Batch #" value="${batchInfo.batch}" onchange="updateBatch('${key}', 'batch', this.value)" class="w-1/2 bg-slate-50 border border-slate-200 rounded px-1.5 py-1 outline-none">
                            <input type="date" value="${batchInfo.expiry}" onchange="updateBatch('${key}', 'expiry', this.value)" class="w-1/2 bg-slate-50 border border-slate-200 rounded px-1.5 py-1 outline-none">
                        </div>
                    </div>
                `;
            }).join('');
            
            updateMetrics();
        }

        function updateStock(key, change) {
            let current = shelfStock[key] !== undefined ? shelfStock[key] : 0;
            current += change;
            if (current < 0) current = 0;
            shelfStock[key] = current;
            document.getElementById(`stock_${key}`).value = current;
            renderItems(document.getElementById('searchBox').value);
        }

        function setStock(key, val) {
            const parsed = parseInt(val);
            shelfStock[key] = isNaN(parsed) || parsed < 0 ? undefined : parsed;
            renderItems(document.getElementById('searchBox').value);
        }

        function updateBatch(key, field, val) {
            if(!itemBatches[key]) itemBatches[key] = { batch: "B-2026", expiry: "" };
            itemBatches[key][field] = val;
        }

        function fillRandomValues() {
            for (let k in shelfStock) delete shelfStock[k];
            for (let cat in inventoryData) {
                inventoryData[cat].forEach(item => { shelfStock[`${cat}_${item.code}_${item.uom}`] = Math.floor(Math.random() * (item.min + 2)); });
            }
            renderItems(document.getElementById('searchBox').value);
        }

        function getGroupedShortages() {
            let grouped = {};
            let totalCount = 0;
            let totalRiskAmount = 0;

            if (activeMobilePayload) {
                activeMobilePayload.items.forEach(item => {
                    if (!grouped[item.cat]) grouped[item.cat] = [];
                    grouped[item.cat].push(item);
                    totalCount++;
                });
            } else {
                for (let cat in inventoryData) {
                    let catShortages = [];
                    inventoryData[cat].forEach(item => {
                        const key = `${cat}_${item.code}_${item.uom}`;
                        const stock = shelfStock[key];
                        if (stock !== undefined && stock < item.min) {
                            const reqQty = item.min - stock;
                            const batchData = itemBatches[key] || { batch: "B-2026", expiry: "" };
                            catShortages.push({ 
                                cat: cat, name: item.name, uom: item.uom, code: item.code, 
                                min: item.min, stock: stock, reqQty: reqQty, 
                                batch: batchData.batch, expiry: batchData.expiry, price: item.price 
                            });
                            totalCount++;
                            totalRiskAmount += (reqQty * item.price);
                        }
                    });
                    if (catShortages.length > 0) grouped[cat] = catShortages;
                }
            }
            return { grouped, totalCount, totalRiskAmount };
        }

        function updateMetrics() {
            const { totalCount, totalRiskAmount } = getGroupedShortages();
            document.getElementById('totalRequestedCount').innerText = `${totalCount} Items`;
            document.getElementById('riskTotalValue').innerText = `₹${totalRiskAmount.toLocaleString('en-IN')}`;
            
            const statusEl = document.getElementById('velocityStatusLabel');
            if(totalRiskAmount > 1500) {
                statusEl.innerText = "🔴 High Shortage Risk";
                statusEl.className = "text-[10px] font-bold px-2 py-0.5 bg-red-200 text-red-900 rounded-full";
            } else if(totalRiskAmount > 0) {
                statusEl.innerText = "🟡 Moderate Watch";
                statusEl.className = "text-[10px] font-bold px-2 py-0.5 bg-amber-200 text-amber-900 rounded-full";
            } else {
                statusEl.innerText = "🟢 Fully Stocked";
                statusEl.className = "text-[10px] font-bold px-2 py-0.5 bg-emerald-200 text-emerald-900 rounded-full";
            }
        }

        // --- Barcode Scanner Integration ---
        function openScannerModal() {
            document.getElementById('scannerModal').classList.remove('hidden');
            codeReader = new ZXing.BrowserBarcodeReader();
            codeReader.decodeFromVideoDevice(null, 'interactive', (result, err) => {
                if (result) {
                    const scannedCode = result.text;
                    document.getElementById('scanStatus').innerText = `Found Code: #${scannedCode}`;
                    document.getElementById('searchBox').value = scannedCode;
                    renderItems(scannedCode);
                    closeScannerModal();
                }
            }).catch(err => {
                console.error(err);
                document.getElementById('scanStatus').innerText = "Camera permission error or not supported.";
            });
        }

        function closeScannerModal() {
            document.getElementById('scannerModal').classList.add('hidden');
            if (codeReader) {
                codeReader.reset();
            }
        }

        // --- Transit & Dispatch Ledger ---
        function dispatchTransitSheet() {
            const { grouped, totalCount } = getGroupedShortages();
            if (totalCount === 0) { alert("No shortages to dispatch!"); return; }

            let itemsToSave = [];
            for (let cat in grouped) {
                grouped[cat].forEach(i => itemsToSave.push(i));
            }

            const targetDateStr = document.getElementById('lookupDateInput').value || new Date().toISOString().split('T')[0];
            const now = new Date();
            const timeFormatted = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

            const newTransit = {
                id: 'transit_' + now.getTime(),
                src: document.getElementById('sourceBranch').value,
                dst: document.getElementById('destBranch').value,
                time: now.getTime(),
                status: "In Transit",
                items: itemsToSave
            };

            let dbStore = JSON.parse(localStorage.getItem('lalitha_transit_ledger')) || {};
            if(!dbStore[targetDateStr]) dbStore[targetDateStr] = [];
            dbStore[targetDateStr].push(newTransit);
            localStorage.setItem('lalitha_transit_ledger', JSON.stringify(dbStore));

            alert("Dispatched! Status set to In Transit.");
            switchMode('packing');
            loadTransitSheets();
        }

        function loadTransitSheets() {
            const targetDate = document.getElementById('lookupDateInput').value;
            let dbStore = JSON.parse(localStorage.getItem('lalitha_transit_ledger')) || {};
            let sheets = dbStore[targetDate] || [];

            document.getElementById('mobileSheetCount').innerText = `${sheets.length} records`;
            const container = document.getElementById('transitSheetsFeed');

            if (sheets.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs bg-white rounded-2xl border border-slate-200">No transit records found for ${targetDate}.</div>`;
                return;
            }

            container.innerHTML = sheets.map((s, idx) => {
                const timeStr = new Date(s.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                const isReceived = s.status === "Received";

                return `
                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 space-y-2">
                        <div class="flex justify-between items-center text-xs font-bold text-slate-800">
                            <span>#${idx + 1} &bull; ${s.src} &rarr; ${s.dst}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] ${isReceived ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${s.status}</span>
                        </div>
                        <p class="text-[11px] text-slate-500">Time: ${timeStr} &bull; <strong class="text-emerald-700">${s.items.length} items</strong></p>
                        <div class="flex gap-1.5 pt-2 border-t border-slate-100">
                            <button onclick="printTransit('${s.id}', '${targetDate}', 'thermal')" class="flex-1 py-1.5 bg-amber-700 text-white rounded-xl text-[10px] font-semibold">Thermal</button>
                            <button onclick="printTransit('${s.id}', '${targetDate}', 'a4')" class="flex-1 py-1.5 bg-slate-800 text-white rounded-xl text-[10px] font-semibold">A4 Print</button>
                            ${!isReceived ? `<button onclick="confirmReceipt('${s.id}', '${targetDate}')" class="flex-1 py-1.5 bg-emerald-600 text-white rounded-xl text-[10px] font-semibold">Confirm Receipt</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function confirmReceipt(sheetId, dateStr) {
            let dbStore = JSON.parse(localStorage.getItem('lalitha_transit_ledger')) || {};
            let sheets = dbStore[dateStr] || [];
            let sheet = sheets.find(s => s.id === sheetId);
            if(sheet) {
                sheet.status = "Received";
                localStorage.setItem('lalitha_transit_ledger', JSON.stringify(dbStore));
                loadTransitSheets();
                alert("Shipment confirmed as received!");
            }
        }

        function printTransit(sheetId, dateStr, type) {
            let dbStore = JSON.parse(localStorage.getItem('lalitha_transit_ledger')) || {};
            let sheets = dbStore[dateStr] || [];
            activeMobilePayload = sheets.find(s => s.id === sheetId);

            if(!activeMobilePayload) { alert("Record not found."); return; }

            if(type === 'thermal') openThermalPreview();
            else openPrintPreview();
        }

        // --- WhatsApp Direct Sharing ---
        function shareToWhatsApp() {
            const { grouped, totalCount } = getGroupedShortages();
            if (totalCount === 0) { alert("No shortages to share!"); return; }

            const source = document.getElementById('sourceBranch').value;
            const dest = document.getElementById('destBranch').value;
            let msg = `*LALITHA NATURALS - PACKING ORDER*\nFrom: ${source} ➔ To: ${dest}\nTotal Items: ${totalCount}\n\n`;

            for(let cat in grouped) {
                msg += `*[ ${cat.toUpperCase()} ]*\n`;
                grouped[cat].forEach(i => {
                    msg += `• ${i.name} (${i.uom}) | Code: #${i.code} | *Req: ${i.reqQty}*\n`;
                });
                msg += `\n`;
            }

            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        }

        // --- Print Engines ---
        function preparePrintData() {
            const { grouped, totalCount } = getGroupedShortages();
            if (totalCount === 0) { alert("No items required to print."); return false; }

            const timeStr = activeMobilePayload ? new Date(activeMobilePayload.time).toLocaleString('en-IN') : new Date().toLocaleString('en-IN');
            const source = activeMobilePayload ? activeMobilePayload.src : document.getElementById('sourceBranch').value;
            const dest = activeMobilePayload ? activeMobilePayload.dst : document.getElementById('destBranch').value;

            // Space-Optimized Multi-Column A4 Layout Generator
            let categoryBlocks = [];
            for (let cat in grouped) {
                let rows = "";
                let globalIdx = 1;
                grouped[cat].forEach(item => {
                    rows += `<tr>
                        <td style="padding: 2px 4px; border: 1px solid #cbd5e1; text-align: center;">${globalIdx++}</td>
                        <td style="padding: 2px 4px; border: 1px solid #cbd5e1;"><strong>${item.name}</strong><br><span style="font-size:7px; color:#555;">Batch: ${item.batch}</span></td>
                        <td style="padding: 2px 4px; border: 1px solid #cbd5e1; text-align: center; font-family: monospace;">#${item.code}</td>
                        <td style="padding: 2px 4px; border: 1px solid #cbd5e1; text-align: center;">${item.uom}</td>
                        <td style="padding: 2px 4px; border: 1px solid #cbd5e1; text-align: center; font-weight: bold; color: #059669;">${item.reqQty}</td>
                    </tr>`;
                });
                
                categoryBlocks.push(`
                    <div style="break-inside: avoid; margin-bottom: 10px;">
                        <h4 style="font-size: 10px; font-weight: bold; color: #059669; background-color: #ecfdf5; padding: 3px 6px; margin: 0 0 2px 0; border-left: 2px solid #059669;">${cat}</h4>
                        <table style="width: 100%; border-collapse: collapse; font-size: 9px;">
                            <thead>
                                <tr style="background-color: #059669; color: white;">
                                    <th style="padding: 2px; border: 1px solid #cbd5e1; width: 22px;">#</th>
                                    <th style="padding: 2px; border: 1px solid #cbd5e1; text-align: left;">Item Name</th>
                                    <th style="padding: 2px; border: 1px solid #cbd5e1; width: 45px;">Code</th>
                                    <th style="padding: 2px; border: 1px solid #cbd5e1; width: 40px;">UOM</th>
                                    <th style="padding: 2px; border: 1px solid #cbd5e1; width: 35px;">Req</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `);
            }
            
            document.getElementById('pdfTemplateContainer').innerHTML = `
                <div style="border-bottom: 1px solid #059669; padding-bottom: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-end;">
                    <div><h2 style="font-size: 14px; font-weight: 800; color: #059669; margin: 0;">LALITHA NATURALS - TRANSIT HUB</h2></div>
                    <div style="text-align: right; font-size: 9px; color: #475569;"><strong>From:</strong> ${source} &rarr; <strong>To:</strong> ${dest} | <strong>Date:</strong> ${timeStr}</div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    ${categoryBlocks.join('')}
                </div>
            `;

            // Thermal Template
            let thermHtml = "";
            for (let cat in grouped) {
                thermHtml += `<div style="margin-bottom: 6px;"><div style="font-weight: bold; background: #000; color: #fff; padding: 2px; font-size: 9px;">[ ${cat.toUpperCase()} ]</div><table style="width: 100%; border-collapse: collapse; font-size: 9px;"><thead><tr style="border-bottom: 1px solid #000;"><th style="text-align: left;">Item (Code/Batch)</th><th style="text-align: right;">Req</th></tr></thead><tbody>`;
                grouped[cat].forEach(item => {
                    thermHtml += `<tr><td style="padding: 2px 0; border-bottom: 1px dotted #ccc;">${item.name} (${item.uom})<br><span style="font-size:8px; font-weight:bold;">Code: #${item.code} | B: ${item.batch}</span></td><td style="text-align: right; vertical-align: top; padding: 2px 0; border-bottom: 1px dotted #ccc; font-weight: bold; font-size: 11px;">${item.reqQty}</td></tr>`;
                });
                thermHtml += `</tbody></table></div>`;
            }
            
            document.getElementById('thermalTemplateContainer').innerHTML = `
                <div style="text-align: center; border-bottom: 1px dashed #000; padding-bottom: 5px; margin-bottom: 5px;">
                    <h3 style="font-size: 12px; font-weight: bold; margin: 0;">LALITHA NATURALS</h3>
                    <p style="font-size: 9px; margin: 2px 0;">${source} &rarr; ${dest}</p>
                    <p style="font-size: 8px; margin: 1px 0;">${timeStr}</p>
                </div>
                ${thermHtml}
                <div style="border-top: 1px dashed #000; margin-top: 5px; padding-top: 4px; text-align: center; font-size: 8px;">
                    <p style="margin:0;">*** END OF TRANSIT SHEET ***</p>
                </div>
            `;
            return true;
        }

        function openPrintPreview() { if (preparePrintData()) { document.getElementById('previewPaper').innerHTML = document.getElementById('pdfTemplateContainer').innerHTML; document.getElementById('previewModal').classList.remove('hidden'); } }
        function closePrintPreview() { document.getElementById('previewModal').classList.add('hidden'); }
        
        function triggerDirectPrint() {
            const printContent = document.getElementById('pdfTemplateContainer').innerHTML;
            const win = window.open('', '', 'height=600,width=400');
            win.document.write('<html><head><title>Print</title><style>body{font-family:Inter,sans-serif;padding:10px;}</style></head><body>');
            win.document.write(printContent);
            win.document.write('</body></html>');
            win.document.close(); win.focus(); setTimeout(() => { win.print(); win.close(); }, 300);
        }

        function openThermalPreview() { if (preparePrintData()) { document.getElementById('thermalPaper').innerHTML = document.getElementById('thermalTemplateContainer').innerHTML; document.getElementById('thermalModal').classList.remove('hidden'); } }
        function closeThermalPreview() { document.getElementById('thermalModal').classList.add('hidden'); }
        
        function triggerThermalPrint() {
            const printContent = document.getElementById('thermalTemplateContainer').innerHTML;
            const win = window.open('', '', 'height=500,width=300');
            win.document.write('<html><head><title>Thermal</title><style>body{font-family:monospace;font-size:10px;width:270px;margin:0;padding:5px;}</style></head><body>');
            win.document.write(printContent);
            win.document.write('</body></html>');
            win.document.close(); win.focus(); setTimeout(() => { win.print(); win.close(); }, 300);
        }

        window.onload = initApp;
    </script>
</body>
</html>
